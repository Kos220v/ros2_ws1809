gps_mission:
  ros__parameters:
    # Путь к маршруту (задаётся из launch; ~ раскрывается в домашний каталог)
    waypoints_file: ""
    # Сколько ДОПОЛНИТЕЛЬНЫХ кругов проехать: 0 = один проход
    number_of_loops: 0
    # С какой точки маршрута начать (0 = первая)
    start_index: 0
    # Крейсерская скорость для информации (реальные лимиты — в
    # nav2_params.yaml: max_vel_x / max_speed_xy)
    speed: 0.6
    # Куда ~/record_waypoint дописывает точки
    record_file: "~/gps_route.yaml"
    # Поставить ноль системы map в первую точку маршрута (рекомендуется:
    # координаты в RViz будут около нуля)
    set_datum_from_first_waypoint: true
    datum_service: "/datum"
    action_name: "follow_gps_waypoints"
    action_wait_timeout: 30.0
    status_topic: "/gps_mission/status"
    gps_topic: "/gps/fix"
    # Тумблер пульта (elrs_receiver -> /control_mode, std_msgs/Int8):
    # 0=AUTO (положение 2), 1=MANUAL (положение 1), 2=AVOID, 3=RETURN_HOME
    control_mode_topic: "/control_mode"
    # true: тумблер в положение 2 (AUTO) сам запускает маршрут — или
    # продолжает его с точки, на которой миссию прервал уход из AUTO;
    # уход из AUTO отменяет миссию. false: старт только сервисом
    # /gps_mission/start.
    start_on_auto: true
