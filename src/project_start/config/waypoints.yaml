# ============================================================================
# Маршрут робота (gps_mission / gps_navigator, параметр waypoints_file).
#
# Тестовая трасса: 6 точек, ~45 м, плавная дуга с юго-востока на восток
# (повороты 13-18° на точку). Записана через ~/record_waypoint.
# Формат: lat/lon в градусах (WGS84), radius — м (радиус "точка взята").
#
# Запуск:
#   ros2 launch gps_navigator route.launch.py waypoints_file:=~/ros2_ws/src/project_start/config/waypoints.yaml
#   (или положить файл в это место по умолчанию)
# Старт: тумблер в положение 2 (AUTO) или
#   ros2 service call /gps_mission/start std_srvs/srv/Trigger
# ============================================================================

waypoints:
  - lat: 56.29908657881005
    lon: 43.922958666057916
    radius: 2
